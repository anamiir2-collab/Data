name: Extract project archive
on:
  push:
    paths:
      - 'datapath-academy.zip'
      - '.github/workflows/extract-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract archive without modifying file contents
        run: |
          unzip -o datapath-academy.zip -d .
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datapath-academy/
          if ! git diff --cached --quiet; then
            git commit -m "Extract datapath academy project files"
            git push
          else
            echo "No extracted file changes to commit."
          fi

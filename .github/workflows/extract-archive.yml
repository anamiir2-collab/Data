name: Move project files to repository root
on:
  push:
    paths:
      - '.github/workflows/extract-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract archive into repository root
        run: |
          if [ ! -f "datapath-academy.zip" ]; then
            echo "datapath-academy.zip was not found."
            exit 1
          fi
          mkdir -p /tmp/datapath-extract
          unzip -q datapath-academy.zip -d /tmp/datapath-extract
          if [ -d "/tmp/datapath-extract/datapath-academy" ]; then
            cp -a /tmp/datapath-extract/datapath-academy/. .
          else
            cp -a /tmp/datapath-extract/. .
          fi
          rm -rf datapath-academy
          rm -f datapath-academy.zip
      - name: Commit extracted files and remove archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract project files into repository root and remove archive"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi

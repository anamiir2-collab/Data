name: Move project files to repository root
on:
  push:
    paths:
      - '.github/workflows/extract-archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move all project files outside datapath-academy
        run: |
          if [ ! -d "datapath-academy" ]; then
            echo "The datapath-academy folder was not found."
            exit 1
          fi
          cp -a datapath-academy/. .
          rm -rf datapath-academy
          rm -f datapath-academy.zip
      - name: Commit the move and archive removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Move project files to repository root and remove archive"
            git push
          else
            echo "No changes to commit."
          fi
